<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘감정 - 지원 및 정책</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .section-title {
            color: #667eea;
            font-size: 14px;
            font-weight: 600;
            margin-top: 25px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        a {
            display: block;
            padding: 15px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            text-align: center;
            font-weight: 500;
            transition: background 0.3s;
        }
        a:hover {
            background: #5a6fd6;
        }
        .support-section {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #eee;
        }
        .support-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
        }
        .support-info p {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .support-info p:last-child {
            margin-bottom: 0;
        }
        .email-link {
            display: inline;
            padding: 0;
            background: none;
            color: #667eea;
            font-weight: 600;
        }
        .email-link:hover {
            background: none;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>오늘감정</h1>
        <p class="subtitle">AI 감정 일기 앱</p>

        <div class="section-title">정책 및 약관</div>
        <div class="links">
            <a href="privacy.html">개인정보처리방침</a>
            <a href="terms.html">이용약관</a>
            <a href="delete-account.html">계정 삭제 안내</a>
        </div>

        <div class="support-section">
            <div class="section-title">고객 지원</div>
            <div class="support-info">
                <p>앱 사용 중 문의사항이나 문제가 있으시면 아래 이메일로 연락해 주세요. 빠른 시일 내에 답변드리겠습니다.</p>
                <p>
                    <strong>지원 이메일:</strong><br>
                    <a href="mailto:pung0805@gmail.com" class="email-link">pung0805@gmail.com</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
